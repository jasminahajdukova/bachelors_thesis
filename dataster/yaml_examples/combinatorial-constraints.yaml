include: []
generate:
  - 'position = auto'
constraints:
  - 'position.x != position.y'
  - 'position.y != position.z'
types:
  position:
    x: 'interval(1,100)'
    y:
      - BLOCKS
      - 'interval(1,9)'
      - 'interval(10,19)'
      - 'interval(20,29)'
      - 'interval(30,39)'
      - 'interval(40,49)'
      - 'interval(50,99)'
    z:
      - BLOCKS
      - 'interval(1,5)'
      - 'interval(6,10)'
schema:
  positions:
    x: position.x
    y: position.y
    z: position.z
